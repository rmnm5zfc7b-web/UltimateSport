<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muscu">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F6F3">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Muscu</title>
<style>
:root{--bg:#F6F6F3;--card:#fff;--ink:#16181D;--mut:#6B7078;--line:#E4E4DE;--acc:#2457F5;--ok:#1E9E5A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;padding:calc(62px + env(safe-area-inset-top)) 0 calc(100px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:16px}
body[data-t=prog]{--tc:#2457F5;--tx:#fff;--tcd:#1B3FB8}
body[data-t=cal]{--tc:#7B3FE4;--tx:#fff;--tcd:#5A2BB0}
body[data-t=timer]{--tc:#0B7FA0;--tx:#fff;--tcd:#075A74}
body[data-t=vac]{--tc:#C026A3;--tx:#fff;--tcd:#8F1D79}
body[data-t=rl]{--tc:#B45309;--tx:#fff;--tcd:#7C3A06}
body[data-t=nut]{--tc:#168A4C;--tx:#fff;--tcd:#0F6B39}
body[data-t=hx]{--tc:#FFD500;--tx:#111;--tcd:#5C4A00}
h1{display:inline-block;background:var(--tc);color:var(--tx);font-size:24px;letter-spacing:-.01em;margin:8px 0 16px;padding:6px 16px;border-radius:12px}
h2{display:block;background:#EEF0F6;background:color-mix(in srgb,var(--tc) 16%,#fff);color:var(--tcd);font-size:15px;margin:22px 0 8px;padding:8px 12px;border-radius:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input,select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 14px;background:var(--tc);color:var(--tx)}
button.ghost{background:#EEF0F6;color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:#EEF0F6;color:var(--ink);font-size:14px}
.chip.on{background:var(--tc);color:var(--tx)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:#EEF0F6;background:color-mix(in srgb,var(--tc) 16%,#fff);color:var(--tcd);margin-left:6px;vertical-align:middle}
.bar{height:8px;background:#EEF0F6;border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--tc)}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 .card{margin:0;text-align:center;padding:10px}
nav{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;overflow-x:auto;scrollbar-width:none;background:rgba(246,246,243,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;min-width:62px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;color:var(--mut);border-radius:0;padding:8px 0;font-size:10px}nav .ic{width:20px;height:20px;margin:0}
.ic{vertical-align:-4px;margin-right:6px}h1 .ic{width:22px;height:22px;margin-right:8px;vertical-align:-4px}details.mb summary .ic{margin-right:2px}
#tmCard{border-radius:18px;color:#fff;text-align:center;padding:28px 16px;margin-bottom:12px;transition:background .3s;background:#0B7FA0}#tmP{font-size:22px;font-weight:600;margin-bottom:8px}#tmT{font-size:84px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}#tmR{opacity:.9;margin-top:8px;min-height:22px}.tb{height:6px;background:rgba(255,255,255,.3);border-radius:9px;margin-top:18px}.tb i{display:block;height:100%;background:#fff;border-radius:9px}
nav button.on{color:var(--tcd);box-shadow:inset 0 -3px 0 var(--tc)}
.hxc{background:#111;color:#fff;border-color:#111}.hxc .mut{color:#B9B9B9}.hxc .tag{background:#FFD500;color:#111}
.y{color:#FFD500}
#timer{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:none;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:14px;padding:10px 12px;max-width:536px;margin:0 auto}#timer .tt{flex:1;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}#timer button{padding:8px 12px}#timer .ghost{background:#2A2D35;color:#fff}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
#toast.on{opacity:1}
@keyframes rlspin{to{transform:rotate(360deg)}}#rlDice .ic{width:56px;height:56px;margin:0;animation:rlspin .7s linear infinite}
#cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-bottom:10px}#cal span{font-size:12px;color:var(--mut)}
.day{position:relative;aspect-ratio:1;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:0;font-weight:500;font-size:14px}
.day.nut::after{content:'';position:absolute;bottom:5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#168A4C}.day.done.nut::after{background:#fff}
.day.done{background:var(--tc);color:var(--tx);border-color:var(--tc)}.day.today{outline:2px solid var(--ink);outline-offset:1px}.day.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 35%,transparent)}
details.mb summary{display:flex;align-items:center;gap:6px;list-style:none}details.mb summary::-webkit-details-marker{display:none}details.mb summary::after{content:'+';margin-left:auto;font-size:20px;color:var(--tcd)}details.mb[open] summary::after{content:'−'}
details summary{font-weight:600;cursor:pointer}
</style>
</head>
<body data-t="prog">
<main id="app"></main>
<nav id="nav"></nav>
<div id="timer"></div>
<div id="toast"></div>
<script>
const K='muscu-app-v1';
const DEF={cfg:{weeks:8,dur:60,days:4,goal:'hyp'},logs:[],nut:{sex:'m',age:30,h:175,w:75,act:1.55,obj:'mass'},food:{},hx:{weeks:10,days:4,lvl:1},mob:{weak:''},done:[],lock:null,nutLog:{},vac:{eq:[],dur:45,days:3,week:1,sess:0},rl:{eq:[],dur:45,focus:'full',res:null},tm:{mode:'tabata',w:20,r:10,n:8,prep:10,am:12,em:10,ei:60,cap:0,cd:60},ui:{tab:'prog',week:1,sess:0}};
let S=Object.assign({},DEF,JSON.parse(localStorage.getItem(K)||'{}'));
if(S.ui&&S.ui.tab==='seance')S.ui.tab='prog';
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const $=s=>document.querySelector(s);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}

/* ---------- Icônes ---------- */
const IC={rl:'<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="9" r="1"/><circle cx="9" cy="15" r="1"/><circle cx="15" cy="15" r="1"/>',vac:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',prog:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',seance:'<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',nut:'<path d="M12 7c-2-2-7-1-7 5 0 4 3 8 5 8 1 0 1-.5 2-.5s1 .5 2 .5c2 0 5-4 5-8 0-6-5-7-7-5z"/><path d="M12 7c0-2 1-4 3-4"/>',hx:'<path d="M12 2c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>',mob:'<circle cx="12" cy="5" r="2"/><path d="M5 9l7 2 7-2M12 11v5l-3 5M12 16l3 5"/>',check:'<path d="M5 12l5 5 9-10"/>',trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4v1a3 3 0 0 0 4 3M16 6h4v1a3 3 0 0 1-4 3M12 13v4M8 21h8M10 17h4"/>',play:'<path d="M7 4l13 8-13 8z"/>',pause:'<path d="M8 5v14M16 5v14"/>',reset:'<path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/>',down:'<path d="M12 3v12M7 10l5 5 5-5M4 20h16"/>',up:'<path d="M12 15V3M7 8l5-5 5 5M4 20h16"/>',save:'<path d="M5 3h12l2 2v16H5zM8 3v6h8V3M8 21v-7h8v7"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

/* ---------- Bibliothèque ---------- */
const EX={sq:'Squat barre / presse',hi:'Soulevé de terre roumain',hp:'Développé couché',vp:'Développé militaire',hr:'Rowing barre ou haltère',vr:'Tractions / tirage vertical',lg:'Fentes bulgares',cf:'Leg curl',le:'Leg extension',bi:'Curl biceps',tr:'Extension triceps poulie',lr:'Élévations latérales',ca:'Mollets debout',co:'Gainage / crunch poulie',fl:'Écarté poulie',rd:'Oiseau / face pull'};
const COMP=new Set(['sq','hi','hp','vp','hr','vr','lg']);
const TPL={A:['Full body A',['sq','hp','hr','lr','cf','tr','co','ca']],B:['Full body B',['hi','vp','vr','lg','fl','bi','co','ca']],C:['Full body C',['hp','hr','sq','vp','le','rd','ca','co']],U:['Haut du corps',['hp','vr','vp','hr','fl','lr','bi','tr','rd']],L:['Bas du corps',['sq','hi','lg','cf','le','ca','co']],P:['Push',['hp','vp','fl','lr','tr']],Pl:['Pull',['vr','hr','rd','bi','co']],G:['Jambes',['sq','hi','lg','cf','ca']]};
const SPLIT={2:['A','B'],3:['A','B','C'],4:['U','L','U','L'],5:['P','Pl','G','U','L'],6:['P','Pl','G','P','Pl','G']};

function session(w,s){
  const c=S.cfg,d=c.days,key=SPLIT[d][s%d],t=TPL[key],str=c.goal==='str';
  const n=Math.max(3,Math.round((c.dur-10)/9)),pos=(w-1)%4+1,dl=pos===4;
  let min=8;
  const ex=t[1].slice(0,n).map(k=>{
    const comp=COMP.has(k),base=str&&comp?4:3,sets=dl?2:base+(pos===3?1:0);
    const rest=str?(comp?['3-5 min',4,240]:['90 s',1.5,90]):(comp?['2-3 min',2.5,150]:['60-90 s',1.25,75]);
    min+=sets*(rest[1]+.75);
    return{k,name:EX[k],sets,reps:str?(comp?'3-5':'6-10'):(comp?'6-10':'10-15'),rir:dl?'4+':[3,2,1][pos-1],tempo:str&&comp?'2-0-X-0':comp?'3-0-1-0':'2-0-2-1',rest:rest[0],rs:rest[2]}
  });
  return{title:t[0],ex,min:Math.round(min),dl,pos}
}
function records(){const r={};S.logs.forEach(l=>{const e=l.load*(1+l.reps/30);if(!r[l.k]||e>r[l.k].e)r[l.k]={e,load:l.load,reps:l.reps}});return r}

/* ---------- Mobilité & échauffement ---------- */
const LBL={hanches:'Hanches',chevilles:'Chevilles',ischios:'Ischio-jambiers',epaules:'Épaules',thoracique:'Haut du dos',dos:'Bas du dos',dorsaux:'Dorsaux',quadriceps:'Quadriceps',bras:'Bras et poignets',tronc:'Tronc'};
const MOB={
hanches:{pre:['Fente basse avec rotation, 5 par côté','Cercles de hanche à 4 appuis, 8 par côté'],post:['Étirement du fléchisseur de hanche en fente, 60 s par côté','Posture du pigeon, 60 s par côté']},
chevilles:{pre:['Genou au mur, 10 par côté'],post:['Étirement du mollet contre un mur, 45 s par côté']},
ischios:{pre:['Balancier de jambe avant-arrière, 10 par côté'],post:['Ischios allongé avec sangle, 45 s par côté']},
epaules:{pre:['Passe-bâton ou élastique, 10 reps','Grands cercles de bras, 10 dans chaque sens'],post:['Étirement pectoral dans un encadrement de porte, 45 s par côté','Posture de l\'enfant bras tendus, 60 s']},
thoracique:{pre:['Rotation thoracique à 4 appuis, 8 par côté'],post:['Extension du haut du dos sur banc ou rouleau, 60 s']},
dos:{pre:['Chat-vache, 10 reps'],post:['Torsion allongée, 45 s par côté']},
dorsaux:{pre:['Tirage élastique bras tendus, 12 reps'],post:['Étirement du grand dorsal contre un banc, 45 s par côté']},
quadriceps:{pre:['Fente arrière dynamique, 8 par côté'],post:['Étirement du quadriceps debout, 45 s par côté']},
bras:{pre:['Cercles de poignets et flexion-extension, 10 reps'],post:['Étirement avant-bras et biceps contre un mur, 30 s par côté']},
tronc:{pre:['Dead bug, 8 par côté'],post:['Étirement abdominal en cobra, 30 s']}};
const RG={sq:['hanches','chevilles'],hi:['ischios','dos'],hp:['epaules','thoracique'],vp:['epaules','thoracique'],hr:['dorsaux','thoracique'],vr:['dorsaux','epaules'],lg:['hanches','chevilles'],cf:['ischios'],le:['quadriceps'],bi:['bras'],tr:['bras','epaules'],lr:['epaules'],ca:['chevilles'],co:['tronc'],fl:['epaules'],rd:['epaules','thoracique']};
const ACT={hanches:'Pont fessier, 12 reps',ischios:'Pont fessier à une jambe, 8 par côté',epaules:'Rotation externe à l\'élastique, 12 par bras',dorsaux:'Rétraction des omoplates, 10 reps',tronc:'Planche, 20 s'};
function regionsOf(se){const c={};se.ex.forEach((e,i)=>(RG[e.k]||[]).forEach(x=>c[x]=(c[x]||0)+10-i));const w=S.mob.weak;if(w)c[w]=(c[w]||0)+100;return Object.keys(c).sort((a,b)=>c[b]-c[a])}
function mobBlock(t,rs,ty,mins){return`<details class="card mb"><summary>${ic('mob')}<b>${t}</b><span class="tag">${mins} min</span></summary>${rs.map(x=>`<div style="margin-top:10px"><b>${LBL[x]}</b>${MOB[x][ty].map(d=>`<div class="mut">${d}</div>`).join('')}</div>`).join('')}</details>`}
function warmBlock(se,rs){const f=se.ex[0],st=S.cfg.goal==='str'&&!se.dl,acts=rs.filter(x=>ACT[x]).slice(0,2).map(x=>ACT[x]);
  const ramp=COMP.has(f.k)?`<div style="margin-top:10px"><b>Montée en charge · ${f.name}</b><div class="mut">${st?'1 × 8 à 50 %, 1 × 5 à 65 %, 1 × 3 à 80 %, 1 × 1 à 90 %':'1 × 10 à 40 %, 1 × 6 à 60 %, 1 × 3 à 80 %'} de ta charge de travail, 1 min de repos entre les séries.</div></div>`:`<div style="margin-top:10px"><b>Série d'approche · ${f.name}</b><div class="mut">1 série de 12 reps avec une charge légère.</div></div>`;
  return`<details class="card mb"><summary>${ic('hx')}<b>Échauffement spécifique</b><span class="tag">8 min</span></summary><div style="margin-top:10px"><b>Général</b><div class="mut">3 min de rameur, vélo ou corde à sauter à allure facile</div></div>${acts.length?`<div style="margin-top:10px"><b>Activation</b>${acts.map(a=>`<div class="mut">${a}</div>`).join('')}</div>`:''}${ramp}<div class="mut" style="margin-top:10px">Pour les exercices suivants : 1 série d'approche légère de 8 à 10 reps.</div></details>`}

/* ---------- Hyrox ---------- */
const STATIONS=['SkiErg 1 000 m','Sled push 50 m','Sled pull 50 m','Burpee broad jumps 80 m','Rameur 1 000 m','Farmers carry 200 m','Sandbag lunges 100 m','Wall balls 100 reps'];
function hxPlan(w){
  const N=S.hx.weeks,d=S.hx.days,v=S.hx.lvl,f=v===.8?'×0,8':v===1.15?'×1,15':'×1';
  const ph=w===N&&N>=6?'Affûtage':w/N<=.4?'Base':'Spécifique',base=ph==='Base',tp=ph==='Affûtage',late=w>=N-3&&!tp;
  const S1={n:'Fractionné',t:base?'6 × 800 m allure 10 km, récup 90 s':'5 × 1 km allure Hyrox, récup 60 s',r:'RPE 8'};
  const S2={n:base?'Circuit course + stations':late?'Simulation Hyrox (4 à 8 stations)':'Course compromise',t:base?'4 tours : 500 m course + 1 station, rythme modéré':late?'4 à 8 × (1 km course + station) à 90-95 % de l\'allure objectif':'4 × (1 km course + station), 2 min entre tours',r:base?'RPE 6-7':'RPE 8-9'};
  const S3={n:'Force',t:'Squat 4×6 · Soulevé roumain 3×8 · Fentes lestées 3×12 · Tractions 3×max · Gainage 3×45 s',r:'RIR 2'};
  const S4={n:'Footing facile',t:base?'40-50 min en Zone 2 (tu peux parler)':'45-60 min Zone 2 + 6 lignes droites de 20 s',r:'RPE 4-5'};
  const S5={n:'Force-endurance stations',t:'Wall balls 5×20 · Sled push/pull 6×25 m · Burpee broad jumps 4×20 m · Farmers 4×50 m',r:'RPE 7'};
  if(tp)return{ph,f:'Volume −40 %',s:[{n:'Rappel d\'allure',t:'3 × 1 km allure course + 2 stations légères',r:'RPE 7'},{n:'Footing facile',t:'25-30 min très tranquille, repos total J-2',r:'RPE 3-4'},{n:'Jour J',t:'Course Hyrox',r:'Tout donner'}].slice(0,Math.max(2,d-1)),taper:1};
  return{ph,f:`Volume ${f}`,s:[S1,S2,S3,S4,S5].slice(0,d)}
}

/* ---------- Nutrition ---------- */
function macros(){
  const n=S.nut,bmr=10*n.w+6.25*n.h-5*n.age+(n.sex==='m'?5:-161),tdee=bmr*n.act;
  const kcal=Math.round(tdee*({mass:1.1,keep:1,cut:.85}[n.obj])/10)*10;
  const p=Math.round(n.w*(n.obj==='cut'?2.2:1.8)),f=Math.round(n.w*(n.obj==='cut'?.8:.9)),c=Math.max(0,Math.round((kcal-4*p-9*f)/4));
  return{kcal,p,f,c,tdee:Math.round(tdee)}
}

/* ---------- Vues ---------- */
const TABS=[['prog','Programme'],['cal','Calendrier'],['timer','Timer'],['hx','Hyrox'],['vac','Vacances'],['rl','Roulette'],['nut','Nutrition']];
function num(id,label,val,min,max,step){return`<div><label>${label}</label><input type="number" inputmode="decimal" value="${val}" min="${min}" max="${max}" step="${step||1}" onchange="setv('${id}',this.value)"></div>`}
function sel(id,label,val,opts){return`<div><label>${label}</label><select onchange="setv('${id}',this.value)">${opts.map(o=>`<option value="${o[0]}" ${String(o[0])===String(val)?'selected':''}>${o[1]}</option>`).join('')}</select></div>`}
function setv(id,v){const[a,b]=id.split('.');if(S.lock&&a==='cfg')return;S[a][b]=isNaN(v)||v===''?v:+v;if(a==='cfg'||a==='hx'){S.ui.week=1;S.ui.sess=0}save();render()}
function go(t){S.ui.tab=t;save();render();scrollTo(0,0)}
function pick(w,s){S.ui.week=w;S.ui.sess=s;S.ui.tab='prog';save();render();scrollTo(0,0)}
function setUi(k,v){S.ui[k]=v;save();render()}
function lockCycle(){S.lock={d:today()};save();render();toast('Cycle verrouillé')}
function newCycle(){if(confirm('Lancer un nouveau cycle ? Les réglages seront déverrouillés, ton historique est conservé.')){S.lock=null;S.ui.week=1;S.ui.sess=0;save();render();toast('Modifie tes réglages puis verrouille le nouveau cycle')}}

function vProg(){
  const c=S.cfg,L=S.lock;if(S.ui.week>c.weeks)S.ui.week=1;if(S.ui.sess>=c.days)S.ui.sess=0;
  let h=`<h1>${ic('seance')}Programme</h1><div class="card"><fieldset ${L?'disabled':''} style="border:0;padding:0;margin:0;min-width:0;${L?'opacity:.55':''}"><div class="row">${num('cfg.weeks','Durée du cycle (semaines)',c.weeks,2,16)}${num('cfg.days','Séances / semaine',c.days,2,6)}</div><div class="row" style="margin-top:10px">${num('cfg.dur','Durée d\'une séance (min)',c.dur,30,120,5)}${sel('cfg.goal','Objectif',c.goal,[['hyp','Hypertrophie'],['str','Force']])}</div></fieldset>${L?`<div class="mut" style="margin:12px 0 10px">Cycle verrouillé depuis le ${L.d}. Les réglages sont figés jusqu'au prochain cycle.</div><button class="ghost" style="width:100%" onclick="newCycle()">${ic('reset')}Lancer un nouveau cycle</button>`:`<button style="width:100%;margin-top:12px" onclick="lockCycle()">${ic('check')}Verrouiller le cycle</button><p class="mut" style="margin:8px 0 0">Une fois verrouillé, tu ne peux plus modifier ces réglages avant de lancer un nouveau cycle.</p>`}</div>`;

  h+=`<h2>Principes utilisés</h2><div class="card mut"><details><summary>Voir le détail</summary><p>Fréquence : chaque groupe musculaire travaillé environ 2 fois par semaine (Schoenfeld et al., 2016).</p><p>Volume : 3 à 4 séries par exercice, soit environ 10 à 20 séries hebdomadaires par groupe (Schoenfeld et al., 2017).</p><p>Intensité : 6-15 répétitions en hypertrophie, 3-5 en force. RIR (répétitions en réserve) qui descend de 3 à 1 sur 3 semaines, puis une semaine de décharge à volume réduit (Helms et al., 2016).</p><p>Tempo : phase excentrique contrôlée de 2-3 s (format excentrique-pause-concentrique-pause).</p><p>Progression : double progression, tu ajoutes 2,5 % de charge quand tu atteins le haut de la fourchette de répétitions sur toutes les séries.</p><p>Nombre d'exercices déduit de la durée : environ 9 min par exercice après 10 min d'échauffement.</p><p>Ces repères sont généraux, pas un avis médical ni un coaching individuel.</p></details></div>`;

function addLog(i,k,rs){
  const load=parseFloat($('#l'+i).value),reps=parseInt($('#r'+i).value),rpe=parseFloat($('#e'+i).value);

  S.logs.push({d:today(),k,load,reps,rpe,sk:S.ui.week+'-'+S.ui.sess});save();render();toast(pr&&b?'Nouveau record !':'Série enregistrée');startTimer(rs)
}

function vacSession(w,si){const v=S.vac,d=v.days,t=VT[VSPLIT[d][si%d]],n=Math.max(3,Math.round((v.dur-8)/7)),eq=new Set(v.eq),dl=w===4,pos=Math.min(w,3),ex=[];
  for(const pat of t[1]){if(ex.length>=n)break;const o=(VX[pat]||[]).find(x=>!x[0]||eq.has(x[0]));if(!o)continue;const core=pat.startsWith('core');
    ex.push({k:PK[pat],name:o[1],sets:dl?2:3+(pos===3?1:0),reps:core?'30-45 s':o[0]==='bar'?'5-12':o[0]?'10-15':'12-20',rir:dl?'4+':[3,2,1][pos-1],tempo:core?'tenu':'3-1-1-0',rest:'60-90 s'})}
  const fin=v.dur>=40&&!dl?VFIN[si%3]:null;
  return{title:t[0],ex,dl,fin,min:Math.round(8+ex.reduce((a,e)=>a+e.sets*1.9,0)+(fin?6:0))}}

function delDone(i){S.done.splice(i,1);save();render()}
function calGo(n){const[y,m]=(S.ui.cm||today().slice(0,7)).split('-').map(Number),dt=new Date(y,m-1+n,1);S.ui.cm=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');save();render()}
function calSel(d){S.ui.cd=d;save();render()}
function vCal(){
  const cm=S.ui.cm||today().slice(0,7),[y,m]=cm.split('-').map(Number),off=(new Date(y,m-1,1).getDay()+6)%7,nd=new Date(y,m,0).getDate(),td=today(),sd=S.ui.cd||td;

  const list=S.done.map((x,i)=>[x,i]).filter(a=>a[0].d===sd);
  const det=list.length?list.map(a=>{const x=a[0],g={};S.logs.filter(l=>l.d===x.d&&x.sk&&l.sk===x.sk).forEach(l=>(g[l.k]=g[l.k]||[]).push(l));

  <h2>${new Date(sd+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</h2>${det}`

/* ---------- Timer d'entraînement ---------- */
const TMODES=[['tabata','Tabata'],['amrap','AMRAP'],['emom','EMOM'],['fortime','For Time'],['cd','Compte à rebours']];
const TM={ph:[],acc:0,t0:0,st:'idle',tick:null,last:-1,ls:-1,rounds:0,rb:[],curB:-1,res:''};
let WL=null;
async function getLock(){try{WL=await navigator.wakeLock.request('screen')}catch(e){}}
function relLock(){try{WL&&WL.release();WL=null}catch(e){}}
function tone(f,d){try{const c=T.ctx;if(!c)return;const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.25;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}
const fmt=x=>{x=Math.max(0,Math.floor(x));return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')};
function setMode(m){S.tm.mode=m;save();render()}
function tmBuild(){const t=S.tm,P=[],M='#0B7FA0';if(t.prep>0)P.push({n:'Préparation',d:t.prep,c:'#6B7078',r:''});
  if(t.mode==='tabata'){for(let i=1;i<=t.n;i++){P.push({n:'Travail',d:t.w,c:'#168A4C',r:`Tour ${i}/${t.n}`});if(i<t.n&&t.r>0)P.push({n:'Repos',d:t.r,c:'#2457F5',r:`Tour ${i}/${t.n}`})}}
  else if(t.mode==='amrap'){const ab=t.ab||1,ar=t.ar??60;for(let i=1;i<=ab;i++){P.push({n:ab>1?`AMRAP ${i}/${ab}`:'AMRAP',d:t.am*60,c:M,r:'Un maximum de tours',b:i-1});if(i<ab&&ar>0)P.push({n:'Récupération',d:ar,c:'#2457F5',r:`Prochain : AMRAP ${i+1}/${ab}`})}}
  else if(t.mode==='emom'){const n=Math.max(1,Math.floor(t.em*60/t.ei));for(let i=1;i<=n;i++)P.push({n:'EMOM',d:t.ei,c:M,r:`Intervalle ${i}/${n}`})}
  else if(t.mode==='fortime')P.push({n:'For Time',d:t.cap>0?t.cap*60:Infinity,c:M,r:t.cap>0?'Time cap '+t.cap+' min':'Sans time cap',up:1});
  else P.push({n:'Compte à rebours',d:t.cd,c:M,r:''});
  return P}
function tmStart(){const P=tmBuild();if(!P.some(p=>p.d>0))return toast('Renseigne une durée');
  try{T.ctx=T.ctx||new(window.AudioContext||window.webkitAudioContext)();T.ctx.resume()}catch(e){}
  Object.assign(TM,{ph:P,acc:0,t0:Date.now(),st:'run',last:-1,ls:-1,rounds:0,res:''});getLock();clearInterval(TM.tick);TM.tick=setInterval(tickT,200);render()}
function tmToggle(){if(TM.st==='run'){TM.acc+=Date.now()-TM.t0;TM.st='pause';clearInterval(TM.tick)}else{TM.t0=Date.now();TM.st='run';TM.tick=setInterval(tickT,200)}render()}
function tmReset(){clearInterval(TM.tick);TM.st='idle';relLock();render()}
function tmShow(){const e=$('#tmRounds');if(e)e.textContent=TM.curB>=0?(TM.rb[TM.curB]||0):'—'}
function tmRound(){if(TM.curB<0)return toast('Récupération en cours, pas de tour à compter');TM.rb[TM.curB]=(TM.rb[TM.curB]||0)+1;tmShow()}
function amrapRes(){const n=Math.max(1,S.tm.ab||1),a=Array.from({length:n},(_,i)=>TM.rb[i]||0),tot=a.reduce((x,y)=>x+y,0);return n===1?tot+' tour'+(tot>1?'s':''):a.map((x,i)=>`AMRAP ${i+1} : ${x}`).join(' · ')+` · Total ${tot}`}
function tmFinish(){TM.acc+=Date.now()-TM.t0;TM.res=fmt(TM.acc/1000);tmEnd()}
function tmEnd(){TM.st='done';clearInterval(TM.tick);relLock();beep();render()}
function tickT(){if(TM.st!=='run')return;const es=(TM.acc+Date.now()-TM.t0)/1000,P=TM.ph;let total=0;P.forEach(p=>total+=p.d);
  if(es>=total){TM.acc=total*1000;TM.res=S.tm.mode==='amrap'?amrapRes():S.tm.mode==='fortime'?'Time cap atteint':'Terminé';return tmEnd()}
  let cum=0,idx=0;for(let i=0;i<P.length;i++){if(es<cum+P[i].d){idx=i;break}cum+=P[i].d}
  if(idx!==TM.last){if(TM.last>=0)tone(P[idx].n==='Repos'||P[idx].n==='Récupération'?600:988,.4);TM.last=idx;TM.ls=-1;TM.curB=P[idx].b??-1;tmShow()}
  const rem=cum+P[idx].d-es;if(isFinite(rem)){const sc=Math.ceil(rem);if(sc<=3&&sc>=1&&sc!==TM.ls){TM.ls=sc;tone(740,.12)}}
  drawTM()}
function drawTM(){const el=$('#tmT');if(!el||!TM.ph.length)return;const P=TM.ph,es=(TM.st==='run'?TM.acc+Date.now()-TM.t0:TM.acc)/1000;
  let cum=0,idx=P.length-1;for(let i=0;i<P.length;i++){if(es<cum+P[i].d){idx=i;break}cum+=P[i].d}
  const p=P[idx],inP=es-cum,rem=p.d-inP;let total=0;P.forEach(x=>total+=x.d);
  el.textContent=p.up?fmt(inP):fmt(Math.ceil(rem));$('#tmP').textContent=p.n;$('#tmR').textContent=p.r;$('#tmCard').style.background=p.c;
  $('#tmB').style.width=(isFinite(total)?Math.min(100,es/total*100):(isFinite(p.d)?inP/p.d*100:0))+'%'}
function vTimer(){
  const t=S.tm,m=t.mode;let h=`<h1>${ic('timer')}Timer</h1>`;
  if(TM.st==='idle'){

    else if(m==='amrap')h+=`<div class="row">${num('tm.am','Durée d\'un AMRAP (min)',t.am,1,120)}${num('tm.ab','Nombre d\'AMRAP',t.ab||1,1,10)}</div><div class="row" style="margin-top:10px">${num('tm.ar','Récupération entre deux (s)',t.ar??60,0,600)}${pre}</div><p class="mut">Un maximum de tours dans le temps imparti. Avec plusieurs AMRAP, une récupération s'intercale entre chacun et tes tours sont comptés séparément.</p>`;
    else if(m==='emom')h+=`<div class="row">${num('tm.em','Durée totale (min)',t.em,1,120)}${num('tm.ei','Intervalle (s)',t.ei,10,600)}</div><div style="margin-top:10px">${pre}</div><p class="mut">À chaque top, tu enchaînes ton travail, le repos est le temps restant. Intervalle de 60 s pour un EMOM classique, 120 s pour un E2MOM.</p>`;
    else if(m==='fortime')h+=`<div class="row">${num('tm.cap','Time cap (min, 0 = aucun)',t.cap,0,120)}${pre}</div><p class="mut">Le chrono monte jusqu'à ce que tu appuies sur Terminé, ou jusqu'au time cap s'il y en a un.</p>`;
    else h+=`<div class="row">${num('tm.cd','Durée (s)',t.cd,1,3600)}${pre}</div>`;
    h+=`</div><button style="width:100%" onclick="tmStart()">${ic('play')}Démarrer</button>`
  }else if(TM.st==='done'){
    h+=`<div id="tmCard" style="background:#16181D"><div id="tmP">Terminé</div><div id="tmT" style="font-size:${(TM.res||'').length>14?24:44}px;line-height:1.3">${TM.res||'Bravo'}</div><div id="tmR"></div><div class="tb"><i id="tmB" style="width:100%"></i></div></div><button style="width:100%" onclick="tmReset()">${ic('reset')}Nouveau timer</button>`
  }else{
    h+=`<div id="tmCard"><div id="tmP"></div><div id="tmT">0:00</div><div id="tmR"></div><div class="tb"><i id="tmB" style="width:0"></i></div></div>
    <div class="row"><button onclick="tmToggle()">${ic(TM.st==='run'?'pause':'play')}${TM.st==='run'?'Pause':'Reprendre'}</button><button class="ghost" onclick="tmReset()">${ic('reset')}Arrêter</button></div>`;
    if(m==='amrap')h+=`<div class="card" style="margin-top:10px"><div class="row"><span>Tours : <b id="tmRounds" style="font-size:22px">${TM.curB>=0?(TM.rb[TM.curB]||0):'—'}</b></span><button onclick="tmRound()">+1 tour</button></div></div>`;
    if(m==='fortime')h+=`<button class="ghost" style="width:100%;margin-top:10px" onclick="tmFinish()">${ic('check')}Terminé</button>`
  }
  return h
}

/* ---------- Minuteur de repos ---------- */
const T={end:0,fin:false,tick:null,ctx:null};
function beep(){try{navigator.vibrate&&navigator.vibrate([200,100,200]);const c=T.ctx;if(!c)return;[0,.25,.5].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.2;o.connect(g);g.connect(c.destination);o.start(c.currentTime+d);o.stop(c.currentTime+d+.15)})}catch(e){}}
function startTimer(sec){try{T.ctx=T.ctx||new(window.AudioContext||window.webkitAudioContext)();T.ctx.resume()}catch(e){}T.end=Date.now()+sec*1000;T.fin=false;clearInterval(T.tick);drawT();T.tick=setInterval(drawT,250)}
function addT(sec){T.end+=sec*1000;drawT()}
function stopT(){T.end=0;T.fin=false;clearInterval(T.tick);drawT()}
function drawT(){const el=$('#timer');if(!T.end&&!T.fin){el.style.display='none';return}el.style.display='flex';
  if(T.end){const r=Math.ceil((T.end-Date.now())/1000);
    if(r<=0){T.end=0;T.fin=true;clearInterval(T.tick);beep();setTimeout(()=>{if(T.fin)stopT()},6000);return drawT()}
    el.innerHTML=`<span class="tt">${Math.floor(r/60)}:${String(r%60).padStart(2,'0')}</span><button class="ghost" onclick="addT(30)">+30 s</button><button class="ghost" onclick="stopT()">Stop</button>`}
  else el.innerHTML=`<span class="tt">Repos terminé</span><button onclick="stopT()">OK</button>`}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&T.end)drawT()});

function render(){
  const t=S.ui.tab;document.body.dataset.t=t;$('#app').innerHTML={prog:vProg,cal:vCal,timer:vTimer,nut:vNut,hx:vHx,vac:vVac,rl:vRl}[t]();
  if(t==='timer')drawTM();
  $('#nav').innerHTML=TABS.map(x=>`<button class="${x[0]===t?'on':''} ${x[0]==='hx'?'hx':''}" onclick="go('${x[0]}')">${ic(x[0])}<span>${x[1]}</span></button>`).join('');
  const nb=$('#nav .on');if(nb)$('#nav').scrollLeft=nb.offsetLeft-($('#nav').clientWidth-nb.offsetWidth)/2
}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
